<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        table {
            font-family: arial, sans-serif;
            border-collapse: collapse;
            width: 100%;
        }

        td,
        th {
            border: 1px solid #dddddd;
            text-align: left;
            padding: 8px;
        }

        tr:nth-child(even) {
            background-color: #dddddd;
        }
    </style>
</head>

<body>

    <h1>Site tabelas</h1>
    <br>
    <br>
    <p>Tabela do ranking de jogadores</p>
    <br>
    <br>
    <table>
        <tr>
            <th>Nome</th>
            <th>Abates</th>
            <th>Mortes</th>
            <th>Assistencia</th>
        </tr>
        <tr>
            <td>Fulano</td>
            <td>10</td>
            <td>20</td>
            <td>4</td>
        </tr>
        <tr>
            <td>Cicrano</td>
            <td>4</td>
            <td>3</td>
            <td>10</td>
        </tr>
        <tr>
            <td>Guilerme</td>
            <td>2</td>
            <td>20</td>
            <td>0</td>
        </tr>
    </table>
    <br>
    <br>
    <a href=""><button>Prox Pag</button></a>
</body>

</html>

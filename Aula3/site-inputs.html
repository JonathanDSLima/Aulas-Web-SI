<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inputs</title>
</head>
<body>

    <h1>Bem vindo aos Inputs 🤖</h1>

    <fieldset>
        <legend>Dados básicos:</legend>

        <label for="">Nome:</label>
        <input type="text" placeholder="Digite seu nome">
        <br><br>

        <label for="">Senha:</label>
        <input type="password" placeholder="Digite sua senha">
        <br><br>

        <label for="">Data nascimento:</label>
        <input type="date" placeholder="Data nascimento">
        <br><br>

        <input type="file" placeholder="Adicione seu arquivo">
        <br><br>

        <input type="number" placeholder="Digite sua altura">
        <br><br>

        <input type="checkbox" name="" id="" placeholder="Concordo com os termos e políticas">
        <label for="">Concordo com os termos e políticas</label>
        <br><br>

        <input type="radio">
        <label for="">Aceito os termos obrigatorios</label>

        <br><br>
        <input type="color" name="" id="">
    </fieldset>

    <fieldset>
        <legend>Endereço:</legend>
    </fieldset>

    <br>
    <a href="">Não tenho cadastro</a>
    
</body>
</html>
